name: Rename Dependabot PRs

# Dependabot cannot name an update type: `commit-message.prefix` is per
# ecosystem, and the only way to get "major" into a title it generates is to
# group majors, which puts every breaking change in one PR.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  rename:
    name: Rename
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # No checkout: pull_request_target runs with write permissions, so the
      # head branch is never fetched or executed here.
      - name: Rename by update type
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # Already renamed: this is what stops the `edited` event the rename
          # triggers from looping.
          case "$PR_TITLE" in
            security\(*|minor\(*|major\(*) exit 0 ;;
          esac

          case "$PR_TITLE" in
            *-security\ group*)    type=security ;;
            *-minor-patch\ group*) type=minor ;;
            # Every minor and patch update belongs to a group, so anything
            # ungrouped is a major.
            *)                     type=major ;;
          esac

          eco="${PR_TITLE#*\(}"
          eco="${eco%%\)*}"

          case "$PR_TITLE" in
            *\ group*)
              # "... group with 3 updates" and the across-directories variant.
              summary="$(printf '%s' "$PR_TITLE" | sed -n 's/.*with \([0-9]* update[s]*\).*/\1/p')"
              ;;
            *)
              # "bump phpunit/phpunit from 9.6.0 to 10.0.0"
              summary="$(printf '%s' "${PR_TITLE#*: bump }" | sed 's/ from / /')"
              ;;
          esac

          if [ -z "$summary" ]; then
            echo "Could not read a summary out of: $PR_TITLE"
            exit 1
          fi

          gh pr edit "$PR_URL" --title "${type}(${eco}): ${summary}"

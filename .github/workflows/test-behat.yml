name: Test Behat CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # Nightly at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"

jobs:
  # Filtering lives here rather than in paths-ignore: a workflow skipped by
  # paths-ignore posts no status at all, which leaves a required check pending
  # forever. A skipped job still posts one.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Decide whether the suite needs to run
        id: filter
        env:
          IGNORE_FILE: .github/behat-ignore.txt
        run: |
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IGNORED="^($(grep -vE '^\s*(#|$)' "$IGNORE_FILE" | paste -sd '|' -))$"
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          # No diff means something is off; run rather than hide a real change.
          if [ -z "$changed" ] || printf '%s\n' "$changed" | grep -qvE "$IGNORED"; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'Only ignored files changed.'
          fi

  test-behat:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: .

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: '8.5'
          tools: composer
          coverage: none
          extensions: mbstring, intl, zip

      - name: Cache dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: vendor
          key: composer-deps-${{ hashFiles('composer.lock') }}
          restore-keys: composer-deps-

      - name: Generate WP admin password
        run: echo "$(openssl rand -hex 8)" > /tmp/WORDPRESS_ADMIN_PASSWORD

      - name: Export environment
        run: |
          echo "TERMINUS_ENV=ci-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "TERMINUS_SITE=pantheon-hud" >> "$GITHUB_ENV"
          echo "SITE_ENV=pantheon-hud.ci-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "WORDPRESS_ADMIN_USERNAME=pantheon" >> "$GITHUB_ENV"
          echo "WORDPRESS_ADMIN_EMAIL=no-reply@getpantheon.com" >> "$GITHUB_ENV"
          echo "WORDPRESS_ADMIN_PASSWORD=$(cat /tmp/WORDPRESS_ADMIN_PASSWORD)" >> "$GITHUB_ENV"

      # Configures SSH to automatically accept new host keys.
      - name: Force SSH to ignore host keys
        run: echo "GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" >> $GITHUB_ENV

      - name: Install SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure Composer GitHub OAuth (optional)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${GITHUB_TOKEN}" ]; then
            echo "GITHUB_TOKEN missing; assuming unauthenticated build"; exit 0
          fi
          { composer config -g github-oauth.github.com "${GITHUB_TOKEN}"; } &>/dev/null

      - name: Install Terminus
        uses: pantheon-systems/terminus-github-actions@b0a005d0e886678b25cb6cd7833cf8d8cf779900 # v1.2.9
        with:
          pantheon-machine-token: ${{ secrets.TERMINUS_TOKEN }}

      - name: Validate WordPress 'Tested Up To' version
        if: github.event_name == 'pull_request'
        uses: jazzsequence/action-validate-plugin-version@6b8b403af6e9eefde9c36c0d342b717d5952b518 # v2.0.1
        with:
          branch: ${{ github.head_ref }}
          dry-run: 'true'

      - name: Behat prepare
        run: |
          composer install --no-progress --prefer-dist
          ./bin/behat-prepare.sh

      - name: Behat tests (strict)
        run: ./bin/behat-test.sh --strict

      - name: Behat cleanup (always)
        if: always()
        run: ./bin/behat-cleanup.sh

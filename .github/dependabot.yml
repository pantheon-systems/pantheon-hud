# This file is managed by github-terraform. Manual changes will be overwritten.
# To modify it, edit orgs/pantheon-systems/files/dependabot/custom/pantheon-hud.yml
# in https://github.com/pantheon-systems/github-terraform
version: 2
updates:
- package-ecosystem: composer
  directory: "/"
  schedule:
    interval: daily
    timezone: America/Los_Angeles
  target-branch: main
  open-pull-requests-limit: 99
  commit-message:
    prefix: deps(composer)
  groups:
    composer-security:
      applies-to: security-updates
      update-types:
      - minor
      - patch
    composer-minor-patch:
      applies-to: version-updates
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: phpunit/phpunit
    versions:
    - ">= 8.a"
    - "< 9"
  - dependency-name: phpunit/phpunit
    versions:
    - ">= 9.a"
    - "< 10"
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: daily
    timezone: America/Los_Angeles
  target-branch: main
  open-pull-requests-limit: 99
  commit-message:
    prefix: deps(npm)
  groups:
    npm-security:
      applies-to: security-updates
      update-types:
      - minor
      - patch
    npm-minor-patch:
      applies-to: version-updates
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
    timezone: America/Los_Angeles
  target-branch: main
  open-pull-requests-limit: 99
  commit-message:
    prefix: deps(actions)
  groups:
    github-actions-security:
      applies-to: security-updates
      update-types:
      - minor
      - patch
    github-actions-minor-patch:
      applies-to: version-updates
      update-types:
      - minor
      - patch
